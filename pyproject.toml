[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "daft-mmops"
version = "0.1.0"
description = "Multimodal data processing operators for Daft"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pyarrow>=12",
]

[project.optional-dependencies]
daft = ["getdaft>=0.7,<0.8"]
text = ["getdaft>=0.7,<0.8"]
image = []
audio = []
video = []
document = []
multimodal = []
# Flattened union of text + image + audio + video + document + multimodal.
# PEP 621 extras cannot directly include other extras by name.
all = ["getdaft>=0.7,<0.8"]
test = [
    "getdaft>=0.7,<0.8",
    "pytest>=7",
]
dev = [
    "getdaft>=0.7,<0.8",
    "pytest>=7",
    "black>=24",
    "build>=1",
    "twine>=5",
]

[project.urls]
Source = "https://github.com/daft-engine/daft-mmops"
Documentation = "https://github.com/daft-engine/daft-mmops/blob/main/docs/operator-development.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src"]
testpaths = ["tests"]
